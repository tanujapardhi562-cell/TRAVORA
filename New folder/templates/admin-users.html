<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Travora - Registered Users</title><style>body{font-family:Arial;background:#f4f7f6;margin:0;padding:30px;color:#18352a}.wrap{max-width:1000px;margin:auto;background:white;padding:25px;border-radius:14px;overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #ddd;text-align:left}th{background:#08764b;color:white}.btn{display:inline-block;margin-bottom:18px;color:#08764b}</style></head><body><main class="wrap"><h1>Registered Users</h1><a class="btn" href="/admin/dashboard">← Admin Dashboard</a><table><tr><th>ID</th><th>Name</th><th>Email</th><th>Registered On</th></tr>{% for user in users %}<tr><td>{{ user.id }}</td><td>{{ user.name }}</td><td>{{ user.email }}</td><td>{{ user.created_at }}</td></tr>{% else %}<tr><td colspan="4">No registered users found.</td></tr>{% endfor %}</table></main></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Travora Admin Dashboard</title><style>body{font-family:Arial;margin:0;background:#f3f7f5;color:#18352a}header{background:#075b3e;color:white;padding:20px 6%;display:flex;justify-content:space-between}main{max-width:900px;margin:40px auto;padding:20px}.cards{display:flex;gap:20px;flex-wrap:wrap}.card{background:white;padding:25px;border-radius:12px;min-width:220px;box-shadow:0 3px 15px #0001}.btn{display:inline-block;margin:12px 10px 0 0;padding:12px 18px;background:#08764b;color:white;text-decoration:none;border-radius:8px}.logout{color:white}</style></head><body><header><b>🌄 Travora Admin</b><a class="logout" href="/admin/logout">Logout</a></header><main><h1>Welcome, {{ session.get('admin_name','Admin') }}</h1><div class="cards"><div class="card"><h2>{{ counts.users }}</h2><p>Registered Users</p></div><div class="card"><h2>{{ counts.bookings }}</h2><p>Total Bookings</p></div></div><a class="btn" href="/admin/users">View Users</a><a class="btn" href="/admin/bookings">View Bookings</a></main></body></html>

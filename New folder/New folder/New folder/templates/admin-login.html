<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Travora Admin Login</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef5f1;font-family:Arial}.box{width:min(430px,92%);background:white;padding:34px;border-radius:18px;box-shadow:0 10px 35px #0002}.brand{font-size:26px;font-weight:bold;color:#08764b}h1{font-size:25px}label{display:block;margin:15px 0 6px;font-weight:bold}input{width:100%;padding:12px;border:1px solid #ccd5d0;border-radius:8px}button{margin-top:20px;width:100%;padding:13px;background:#08764b;color:white;border:0;border-radius:8px;font-weight:bold;cursor:pointer}.error{color:#b42318}.back{display:block;text-align:center;margin-top:18px;color:#08764b}</style></head><body><main class="box"><div class="brand">🌄 Travora</div><h1>Admin Login</h1><p>Sign in to manage Travora users and bookings.</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="POST" action="/admin/login"><label>Email</label><input type="email" name="email" required><label>Password</label><input type="password" name="password" required><button type="submit">Admin Login</button></form><a class="back" href="/login">← User Login</a></main></body></html>

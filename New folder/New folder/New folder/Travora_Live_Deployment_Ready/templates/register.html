<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Travora - Register</title>
<style>body{margin:0;font-family:Arial,Helvetica,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(120deg,#073d2c,#16835b)}.card{width:min(480px,100%);background:#fff;padding:42px;border-radius:22px;box-shadow:0 20px 60px #0004}.brand{font-size:28px;font-weight:800;color:#123b30}.brand span{color:#0b8f5a}.card h2{font-size:30px;margin-bottom:8px}.sub{color:#6b7280}.field{margin:18px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:10px;font-size:15px;box-sizing:border-box}.btn{width:100%;padding:14px;border:0;border-radius:10px;background:#0b8f5a;color:#fff;font-weight:700;font-size:16px;cursor:pointer}.message{min-height:22px;margin-top:12px;color:#0b8f5a;font-weight:700}.links{text-align:center;margin-top:18px}.links a{color:#0b8f5a;font-weight:700;text-decoration:none}</style></head>
<body><div class="card"><div class="brand">🌄 Travora</div><h2>Create Account</h2>
<p class="sub">Join Travora and start planning your Maharashtra trip.</p>
<form method="POST" action="/register">
{% if error %}<div class="message" style="color:#b42318;margin-bottom:12px;">{{ error }}</div>{% endif %}
<div class="field"><label for="registerName">Name</label><input id="registerName" name="name" required placeholder="Enter your name"></div>
<div class="field"><label for="registerEmail">Email</label><input id="registerEmail" name="email" type="email" required placeholder="Enter your email"></div>
<div class="field"><label for="registerPassword">Password</label><input id="registerPassword" name="password" type="password" minlength="6" required placeholder="Create a password"></div>
<button class="btn" type="submit">Create Account</button>
</form>
<div class="links">Already registered? <a href="login.html">Login</a><br><br>
<a href="index.html">← Back to Home</a></div></div>
<script src="js/app.js">

</script>
</body>
</html>

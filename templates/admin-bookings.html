<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Travora - Bookings</title><style>body{font-family:Arial;background:#f4f7f6;margin:0;padding:30px;color:#18352a}.wrap{max-width:1100px;margin:auto;background:white;padding:25px;border-radius:14px;overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #ddd;text-align:left}th{background:#08764b;color:white}.btn{display:inline-block;margin-bottom:18px;color:#08764b}</style></head><body><main class="wrap"><h1>All Bookings</h1><a class="btn" href="/admin/dashboard">← Admin Dashboard</a><table><tr><th>Booking ID</th><th>User</th><th>Email</th><th>Hotel</th><th>Booking Date</th><th>Travellers</th><th>Status</th></tr>{% for b in bookings %}<tr><td>{{ b.id }}</td><td>{{ b.user_name }}</td><td>{{ b.email }}</td><td>{{ b.hotel_name }}</td><td>{{ b.booking_date }}</td><td>{{ b.travellers }}</td><td>{{ b.status }}</td></tr>{% else %}<tr><td colspan="7">No bookings found.</td></tr>{% endfor %}</table></main></body></html>
